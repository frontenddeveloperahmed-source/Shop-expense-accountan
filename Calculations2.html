<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Sora', 'Noto Sans Arabic', 'sans-serif'] } } }
        }
    </script>
    <style>
        :root {
            --bg: #0C0C0C;
            --bg-elevated: #161616;
            --card: rgba(255,245,230,0.028);
            --card-hover: rgba(255,245,230,0.055);
            --accent: #C9963A;
            --accent-hover: #DBA94C;
            --accent-subtle: rgba(201,150,58,0.12);
            --fg: #F0EBE3;
            --fg-secondary: #9B9490;
            --muted: #5C5652;
            --border: rgba(255,245,230,0.07);
            --danger: #C94A3A;
            --danger-subtle: rgba(201,74,58,0.12);
            --success: #3AC97A;
            --success-subtle: rgba(58,201,122,0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Sora','Noto Sans Arabic',sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; overflow-x:hidden; }

        /* Ambient background orbs */
        .bg-orb { position:fixed; border-radius:50%; filter:blur(130px); opacity:0.12; pointer-events:none; z-index:0; }
        .bg-orb-1 { width:550px; height:550px; background:var(--accent); top:-180px; right:-160px; animation:orbFloat1 22s ease-in-out infinite; }
        .bg-orb-2 { width:380px; height:380px; background:#3A8CC9; bottom:-120px; left:-120px; animation:orbFloat2 28s ease-in-out infinite; }
        @keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-70px,50px)} }
        @keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(50px,-70px)} }

        /* Scrollbar */
        ::-webkit-scrollbar { width:5px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--muted); border-radius:3px; }

        /* Card */
        .vault-card {
            background:var(--card); border:1px solid var(--border);
            backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
            border-radius:16px; transition:all .3s cubic-bezier(.4,0,.2,1); position:relative; overflow:hidden;
        }
        .vault-card:hover { background:var(--card-hover); border-color:rgba(255,245,230,0.11); transform:translateY(-2px); box-shadow:0 10px 40px rgba(0,0,0,0.35); }

        /* Inputs */
        .vault-input {
            background:rgba(255,245,230,0.035); border:1px solid var(--border); border-radius:12px;
            padding:11px 14px; color:var(--fg); font-family:inherit; font-size:14px; width:100%;
            transition:all .2s ease; outline:none;
        }
        .vault-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-subtle); }
        .vault-input::placeholder { color:var(--muted); }
        textarea.vault-input { resize:vertical; min-height:80px; line-height:1.6; }

        /* Buttons */
        .btn-primary { background:var(--accent); color:#0C0C0C; font-weight:600; padding:11px 24px; border-radius:12px; border:none; cursor:pointer; font-family:inherit; font-size:14px; transition:all .2s ease; }
        .btn-primary:hover { background:var(--accent-hover); transform:translateY(-1px); box-shadow:0 4px 18px rgba(201,150,58,0.35); }
        .btn-ghost { background:transparent; color:var(--fg-secondary); font-weight:500; padding:11px 24px; border-radius:12px; border:1px solid var(--border); cursor:pointer; font-family:inherit; font-size:14px; transition:all .2s ease; }
        .btn-ghost:hover { background:rgba(255,245,230,0.06); color:var(--fg); }
        .btn-danger-sm { background:var(--danger-subtle); color:var(--danger); font-weight:600; padding:9px 18px; border-radius:10px; border:1px solid rgba(201,74,58,0.18); cursor:pointer; font-family:inherit; font-size:13px; transition:all .2s ease; }
        .btn-danger-sm:hover { background:var(--danger); color:#fff; }

        /* Icon button */
        .icon-btn {
            width:34px; height:34px; border-radius:9px; border:none; background:rgba(255,245,230,0.04);
            color:var(--fg-secondary); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
            transition:all .2s ease; font-size:12px; flex-shrink:0;
        }
        .icon-btn:hover { background:rgba(255,245,230,0.1); color:var(--fg); }
        .icon-btn.copied { background:var(--success-subtle); color:var(--success); }

        /* Filter tabs */
        .filter-tab {
            padding:7px 18px; border-radius:10px; border:none; background:transparent; color:var(--fg-secondary);
            font-family:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:all .2s ease; white-space:nowrap;
        }
        .filter-tab:hover { color:var(--fg); background:rgba(255,245,230,0.04); }
        .filter-tab.active { background:var(--accent-subtle); color:var(--accent); }
        .filter-count { font-size:11px; opacity:0.6; margin-left:4px; }
        [dir="rtl"] .filter-count { margin-left:0; margin-right:4px; }

        /* Modal */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.72); backdrop-filter:blur(10px); z-index:100;
            display:flex; align-items:center; justify-content:center; padding:16px;
            opacity:0; pointer-events:none; transition:opacity .25s ease;
        }
        .modal-overlay.open { opacity:1; pointer-events:all; }
        .modal-box {
            background:var(--bg-elevated); border:1px solid var(--border); border-radius:20px;
            width:100%; max-width:460px; max-height:88vh; overflow-y:auto;
            transform:translateY(18px) scale(0.96); transition:transform .3s cubic-bezier(.4,0,.2,1);
        }
        .modal-overlay.open .modal-box { transform:translateY(0) scale(1); }

        /* Toast */
        .toast-el {
            position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(90px);
            background:var(--bg-elevated); border:1px solid var(--border); color:var(--fg);
            padding:11px 22px; border-radius:12px; font-size:13px; font-weight:500; z-index:200;
            transition:transform .35s cubic-bezier(.4,0,.2,1); pointer-events:none;
            box-shadow:0 8px 36px rgba(0,0,0,0.45); display:flex; align-items:center; gap:8px;
        }
        .toast-el.show { transform:translateX(-50%) translateY(0); }

        /* FAB */
        .fab-wrap { position:fixed; bottom:28px; right:28px; z-index:50; }
        [dir="rtl"] .fab-wrap { right:auto; left:28px; }
        .fab-btn {
            width:54px; height:54px; border-radius:16px; background:var(--accent); color:#0C0C0C; border:none;
            font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all .3s cubic-bezier(.4,0,.2,1); box-shadow:0 4px 24px rgba(201,150,58,0.4);
        }
        .fab-btn:hover { transform:scale(1.06); box-shadow:0 6px 32px rgba(201,150,58,0.5); }
        .fab-btn.open { transform:rotate(45deg); border-radius:50%; }
        .fab-menu {
            position:absolute; bottom:66px; right:0; display:flex; flex-direction:column; gap:8px;
            opacity:0; pointer-events:none; transform:translateY(8px); transition:all .25s cubic-bezier(.4,0,.2,1);
        }
        [dir="rtl"] .fab-menu { right:auto; left:0; }
        .fab-menu.open { opacity:1; pointer-events:all; transform:translateY(0); }
        .fab-menu-item {
            display:flex; align-items:center; gap:10px; padding:10px 16px;
            background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
            color:var(--fg); font-family:inherit; font-size:13px; font-weight:500; cursor:pointer;
            white-space:nowrap; transition:all .2s ease; box-shadow:0 4px 20px rgba(0,0,0,0.35);
        }
        .fab-menu-item:hover { background:rgba(255,245,230,0.07); border-color:rgba(255,245,230,0.14); }
        .fab-menu-item .fab-icon {
            width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:12px;
        }

        /* Lang toggle */
        .lang-toggle { display:flex; background:rgba(255,245,230,0.04); border:1px solid var(--border); border-radius:10px; overflow:hidden; flex-shrink:0; }
        .lang-btn { padding:6px 13px; border:none; background:transparent; color:var(--fg-secondary); font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; transition:all .2s ease; letter-spacing:.4px; }
        .lang-btn.active { background:var(--accent); color:#0C0C0C; }

        /* Delete confirm overlay on card */
        .del-overlay {
            position:absolute; inset:0; background:rgba(12,12,12,0.93); backdrop-filter:blur(6px);
            border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:12px; opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:5;
        }
        .del-overlay.active { opacity:1; pointer-events:all; }

        /* Field row in card */
        .f-row { display:flex; align-items:center; gap:8px; padding:4px 0; }
        .f-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:600; min-width:64px; flex-shrink:0; }
        .f-val { font-size:13px; color:var(--fg); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .pw-masked { letter-spacing:2.5px; }

        /* Empty state */
        .empty-icon { width:72px; height:72px; border-radius:18px; background:var(--accent-subtle); display:flex; align-items:center; justify-content:center; margin:0 auto 20px; font-size:26px; color:var(--accent); }

        /* Animate in */
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        .anim-in { animation:fadeUp .35s cubic-bezier(.4,0,.2,1) both; }

        /* Top accent bar */
        .top-bar { position:fixed; top:0; left:0; right:0; height:2px; z-index:60; background:linear-gradient(90deg,transparent 5%,var(--accent) 50%,transparent 95%); }

        /* Reduced motion */
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
    </style>
</head>
<body>
    <!-- Ambient background -->
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
    <div class="top-bar" aria-hidden="true"></div>

    <!-- App shell -->
    <div class="relative z-10 min-h-screen flex flex-col">
        <!-- Header -->
        <header id="header" class="sticky top-0 z-40" style="background:rgba(12,12,12,0.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border);"></header>

        <!-- Main -->
        <main class="flex-1 max-w-2xl mx-auto w-full px-4 sm:px-6 pt-6 pb-28">
            <div id="search-area"></div>
            <div id="filter-area" class="mt-4"></div>
            <div id="cards-area" class="mt-4 flex flex-col gap-3"></div>
        </main>
    </div>

    <!-- FAB -->
    <div id="fab-area" class="fab-wrap"></div>

    <!-- Modal -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true">
        <div id="modal-box" class="modal-box"></div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast-el" role="status" aria-live="polite"></div>

    <script>
    /* =========================================================
       STATE
       ========================================================= */
    const S = {
        lang: (() => { try { return localStorage.getItem('vaultix-lang') || 'en'; } catch { return 'en'; } })(),
        filter: 'all',
        search: '',
        items: (() => { try { return JSON.parse(localStorage.getItem('vaultix-items')) || []; } catch { return []; } })(),
        editId: null,
        modalType: null,
        modalOpen: false,
        fabOpen: false,
        visPw: new Set(),
        delConfirmId: null,
    };

    /* =========================================================
       i18n
       ========================================================= */
    const L = {
        en: {
            appName:'Vaultix', tagline:'Secure your digital life',
            search:'Search vault...', all:'All', accounts:'Accounts', phrases:'Phrases',
            addAccount:'Add Account', addPhrase:'Add Phrase',
            editAccount:'Edit Account', editPhrase:'Edit Phrase',
            title:'Title', username:'Username', password:'Password',
            url:'Website URL', notes:'Notes', phrase:'Phrase / Note',
            save:'Save', cancel:'Cancel', delete:'Delete', edit:'Edit',
            copy:'Copy', copied:'Copied!', show:'Show', hide:'Hide',
            noItems:'Your vault is empty', noItemsSub:'Tap the button below to add your first account or phrase',
            noResults:'No matches found', noResultsSub:'Try a different search term',
            delConfirm:'Delete this item?', delConfirmSub:'This action cannot be undone',
            confirm:'Confirm', saved:'Saved successfully', deleted:'Item deleted',
            noRequired:'No field is required — save with any single field',
            generate:'Generate', close:'Close',
        },
        ar: {
            appName:'فولتكس', tagline:'أمّن حياتك الرقمية',
            search:'ابحث في الخزنة...', all:'الكل', accounts:'الحسابات', phrases:'العبارات',
            addAccount:'إضافة حساب', addPhrase:'إضافة عبارة',
            editAccount:'تعديل الحساب', editPhrase:'تعديل العبارة',
            title:'العنوان', username:'اسم المستخدم', password:'كلمة المرور',
            url:'رابط الموقع', notes:'ملاحظات', phrase:'عبارة / ملاحظة',
            save:'حفظ', cancel:'إلغاء', delete:'حذف', edit:'تعديل',
            copy:'نسخ', copied:'تم النسخ!', show:'إظهار', hide:'إخفاء',
            noItems:'خزنتك فارغة', noItemsSub:'اضغط الزر أدناه لإضافة حسابك أو عبارتك الأولى',
            noResults:'لا توجد نتائج', noResultsSub:'جرّب مصطلح بحث مختلف',
            delConfirm:'حذف هذا العنصر؟', delConfirmSub:'لا يمكن التراجع عن هذا الإجراء',
            confirm:'تأكيد', saved:'تم الحفظ بنجاح', deleted:'تم حذف العنصر',
            noRequired:'لا يوجد حقول إلزامية — احفظ بأي حقل واحد',
            generate:'توليد', close:'إغلاق',
        }
    };
    const t = k => L[S.lang][k] || k;

    /* =========================================================
       UTILS
       ========================================================= */
    function esc(s) { return s ? s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }
    function persist() { try { localStorage.setItem('vaultix-items', JSON.stringify(S.items)); localStorage.setItem('vaultix-lang', S.lang); } catch {} }
    function genPw(len=20) { const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*_-+='; let p=''; for(let i=0;i<len;i++) p+=c[Math.floor(Math.random()*c.length)]; return p; }

    let toastTimer = null;
    function toast(msg) {
        const el = document.getElementById('toast');
        el.innerHTML = `<i class="fas fa-check-circle" style="color:var(--success)"></i> ${esc(msg)}`;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    /* =========================================================
       FILTERED ITEMS
       ========================================================= */
    function filtered() {
        let arr = S.items;
        if (S.filter === 'accounts') arr = arr.filter(i => i.type === 'account');
        if (S.filter === 'phrases') arr = arr.filter(i => i.type === 'phrase');
        if (S.search) {
            const q = S.search.toLowerCase();
            arr = arr.filter(i => [i.title,i.username,i.password,i.url,i.notes,i.phrase].some(f => (f||'').toLowerCase().includes(q)));
        }
        return arr;
    }

    /* =========================================================
       RENDER: HEADER
       ========================================================= */
    function renderHeader() {
        document.getElementById('header').innerHTML = `
            <div class="max-w-2xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center text-sm" style="background:var(--accent-subtle);color:var(--accent)">
                        <i class="fas fa-shield-halved"></i>
                    </div>
                    <span class="text-base font-bold tracking-tight" style="color:var(--fg)">${t('appName')}</span>
                </div>
                <div class="lang-toggle">
                    <button class="lang-btn ${S.lang==='en'?'active':''}" onclick="setLang('en')" aria-label="English">EN</button>
                    <button class="lang-btn ${S.lang==='ar'?'active':''}" onclick="setLang('ar')" aria-label="العربية">عربي</button>
                </div>
            </div>`;
    }

    /* =========================================================
       RENDER: SEARCH
       ========================================================= */
    function renderSearch() {
        document.getElementById('search-area').innerHTML = `
            <div class="relative">
                <i class="fas fa-magnifying-glass absolute top-1/2 -translate-y-1/2 text-xs" style="color:var(--muted);${S.lang==='ar'?'right:14px;left:auto':'left:14px;right:auto'}"></i>
                <input type="text" id="search-input" class="vault-input" style="${S.lang==='ar'?'padding-right:38px;padding-left:14px':'padding-left:38px;padding-right:14px'}" placeholder="${t('search')}" value="${esc(S.search)}" oninput="onSearch(this.value)" aria-label="${t('search')}">
            </div>`;
    }

    /* =========================================================
       RENDER: FILTERS
       ========================================================= */
    function renderFilters() {
        const ac = S.items.filter(i=>i.type==='account').length;
        const pc = S.items.filter(i=>i.type==='phrase').length;
        const tabs = [
            { key:'all', label:t('all'), count:S.items.length },
            { key:'accounts', label:t('accounts'), count:ac },
            { key:'phrases', label:t('phrases'), count:pc },
        ];
        document.getElementById('filter-area').innerHTML = `<div class="flex gap-2 flex-wrap">${tabs.map(tb => `
            <button class="filter-tab ${S.filter===tb.key?'active':''}" data-filter="${tb.key}" onclick="onFilter('${tb.key}')">
                ${tb.label}<span class="filter-count">${tb.count}</span>
            </button>`).join('')}</div>`;
    }

    /* =========================================================
       RENDER: CARDS
       ========================================================= */
    function renderCards() {
        const items = filtered();
        const area = document.getElementById('cards-area');

        if (S.items.length === 0) {
            area.innerHTML = `
                <div class="text-center pt-16 pb-8 anim-in">
                    <div class="empty-icon"><i class="fas fa-vault"></i></div>
                    <p class="text-base font-semibold mb-2" style="color:var(--fg)">${t('noItems')}</p>
                    <p class="text-sm" style="color:var(--fg-secondary)">${t('noItemsSub')}</p>
                </div>`;
            return;
        }

        if (items.length === 0) {
            area.innerHTML = `
                <div class="text-center pt-16 pb-8 anim-in">
                    <div class="empty-icon"><i class="fas fa-magnifying-glass"></i></div>
                    <p class="text-base font-semibold mb-2" style="color:var(--fg)">${t('noResults')}</p>
                    <p class="text-sm" style="color:var(--fg-secondary)">${t('noResultsSub')}</p>
                </div>`;
            return;
        }

        area.innerHTML = items.map((item, idx) => buildCard(item, idx)).join('');
    }

    function buildCard(item, idx) {
        const isAcc = item.type === 'account';
        const confirming = S.delConfirmId === item.id;
        const pwVis = S.visPw.has(item.id);
        const delay = Math.min(idx * 40, 400);

        /* Build field rows */
        let fields = '';
        if (isAcc) {
            if (item.username) fields += rowHtml(t('username'), esc(item.username), item.id, 'username');
            if (item.password) {
                const display = pwVis ? esc(item.password) : '••••••••••';
                fields += `
                    <div class="f-row">
                        <span class="f-label">${t('password')}</span>
                        <span class="f-val ${pwVis?'':'pw-masked'}">${display}</span>
                        <button class="icon-btn" data-toggle-pw="${item.id}" title="${pwVis?t('hide'):t('show')}"><i class="fas ${pwVis?'fa-eye-slash':'fa-eye'}"></i></button>
                        <button class="icon-btn" data-copy-id="${item.id}" data-copy-field="password" title="${t('copy')}"><i class="fas fa-copy"></i></button>
                    </div>`;
            }
            if (item.url) fields += rowHtml('URL', esc(item.url), item.id, 'url');
        } else {
            if (item.phrase) {
                fields += `
                    <div class="mt-3">
                        <p class="text-sm leading-relaxed" style="color:var(--fg);word-break:break-word;white-space:pre-wrap">${esc(item.phrase)}</p>
                        <div class="mt-2">
                            <button class="icon-btn" data-copy-id="${item.id}" data-copy-field="phrase" title="${t('copy')}"><i class="fas fa-copy"></i></button>
                        </div>
                    </div>`;
            }
        }
        if (item.notes) {
            fields += `<div class="mt-3 text-xs leading-relaxed" style="color:var(--fg-secondary);border-top:1px solid var(--border);padding-top:10px;word-break:break-word;white-space:pre-wrap">${esc(item.notes)}</div>`;
        }

        const iconBg = isAcc ? 'var(--accent-subtle)' : 'rgba(58,201,122,0.12)';
        const iconClr = isAcc ? 'var(--accent)' : 'var(--success)';
        const icon = isAcc ? 'fa-key' : 'fa-quote-left';
        const typeLabel = isAcc ? t('accounts') : t('phrases');
        const titleText = item.title || typeLabel;

        return `
        <div class="vault-card p-5 anim-in" style="animation-delay:${delay}ms">
            ${confirming ? `
                <div class="del-overlay active">
                    <i class="fas fa-triangle-exclamation text-2xl" style="color:var(--danger)"></i>
                    <p class="text-sm font-semibold">${t('delConfirm')}</p>
                    <p class="text-xs" style="color:var(--fg-secondary)">${t('delConfirmSub')}</p>
                    <div class="flex gap-2.5 mt-1">
                        <button class="btn-danger-sm" data-do-delete="${item.id}">${t('confirm')}</button>
                        <button class="btn-ghost" data-cancel-delete style="padding:9px 18px;font-size:13px">${t('cancel')}</button>
                    </div>
                </div>` : ''}
            <div class="flex items-start justify-between gap-3 mb-2">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-9 h-9 flex items-center justify-center flex-shrink-0" style="background:${iconBg};color:${iconClr};border-radius:10px;font-size:13px">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div class="min-w-0">
                        <h3 class="text-sm font-semibold truncate" style="color:var(--fg)">${esc(titleText)}</h3>
                        <span class="text-[11px]" style="color:var(--muted)">${typeLabel}</span>
                    </div>
                </div>
                <div class="flex gap-1 flex-shrink-0">
                    <button class="icon-btn" data-edit="${item.id}" title="${t('edit')}"><i class="fas fa-pen-to-square"></i></button>
                    <button class="icon-btn" data-ask-delete="${item.id}" title="${t('delete')}" style="color:var(--danger)"><i class="fas fa-trash-can"></i></button>
                </div>
            </div>
            ${fields || `<p class="text-xs mt-1" style="color:var(--muted)">—</p>`}
        </div>`;
    }

    function rowHtml(label, displayVal, id, field) {
        return `<div class="f-row">
            <span class="f-label">${label}</span>
            <span class="f-val">${displayVal}</span>
            <button class="icon-btn" data-copy-id="${id}" data-copy-field="${field}" title="${t('copy')}"><i class="fas fa-copy"></i></button>
        </div>`;
    }

    /* =========================================================
       RENDER: FAB
       ========================================================= */
    function renderFab() {
        document.getElementById('fab-area').innerHTML = `
            <div class="fab-menu ${S.fabOpen?'open':''}">
                <button class="fab-menu-item" data-fab-add="account">
                    <span class="fab-icon" style="background:var(--accent-subtle);color:var(--accent)"><i class="fas fa-key"></i></span>
                    ${t('addAccount')}
                </button>
                <button class="fab-menu-item" data-fab-add="phrase">
                    <span class="fab-icon" style="background:rgba(58,201,122,0.12);color:var(--success)"><i class="fas fa-quote-left"></i></span>
                    ${t('addPhrase')}
                </button>
            </div>
            <button class="fab-btn ${S.fabOpen?'open':''}" data-fab-toggle aria-label="Add">
                <i class="fas fa-plus"></i>
            </button>`;
    }

    /* =========================================================
       RENDER: MODAL
       ========================================================= */
    function renderModal() {
        const isAcc = S.modalType === 'account';
        const isEdit = S.editId !== null;
        const heading = isAcc ? (isEdit ? t('editAccount') : t('addAccount')) : (isEdit ? t('editPhrase') : t('addPhrase'));

        let formFields = '';
        if (isAcc) {
            formFields = `
                ${modalField('field-title', t('title'), 'text')}
                ${modalField('field-username', t('username'), 'text')}
                <div class="relative">
                    ${modalField('field-password', t('password'), 'password')}
                    <button type="button" class="icon-btn absolute top-1/2 -translate-y-1/2" style="${S.lang==='ar'?'left:8px;right:auto':'right:8px;left:auto'}" data-gen-pw title="${t('generate')}"><i class="fas fa-dice"></i></button>
                </div>
                ${modalField('field-url', t('url'), 'text')}
                ${modalTextarea('field-notes', t('notes'))}`;
        } else {
            formFields = `
                ${modalField('field-title', t('title'), 'text')}
                ${modalTextarea('field-phrase', t('phrase'))}
                ${modalTextarea('field-notes', t('notes'))}`;
        }

        document.getElementById('modal-box').innerHTML = `
            <div class="p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-lg font-bold" style="color:var(--fg)">${heading}</h2>
                    <button class="icon-btn" data-modal-close aria-label="${t('close')}"><i class="fas fa-xmark"></i></button>
                </div>
                <form id="vault-form" class="flex flex-col gap-4" onsubmit="handleSave(event)">
                    ${formFields}
                    <p class="text-[11px] text-center" style="color:var(--muted)"><i class="fas fa-info-circle" style="margin-${S.lang==='ar'?'left':'right'}:4px"></i>${t('noRequired')}</p>
                    <div class="flex gap-3 mt-2">
                        <button type="submit" class="btn-primary flex-1">${t('save')}</button>
                        <button type="button" class="btn-ghost flex-1" data-modal-close>${t('cancel')}</button>
                    </div>
                </form>
            </div>`;

        /* Pre-fill for edit */
        if (isEdit) {
            const item = S.items.find(i => i.id === S.editId);
            if (item) {
                const set = (id, val) => { const el = document.getElementById(id); if (el && val) el.value = val; };
                set('field-title', item.title);
                set('field-username', item.username);
                set('field-password', item.password);
                set('field-url', item.url);
                set('field-notes', item.notes);
                set('field-phrase', item.phrase);
            }
        }
    }

    function modalField(id, label, type) {
        return `<div>
            <label class="block text-[11px] font-semibold mb-1.5 uppercase tracking-wider" style="color:var(--muted)" for="${id}">${label}</label>
            <input type="${type}" id="${id}" class="vault-input" autocomplete="off">
        </div>`;
    }
    function modalTextarea(id, label) {
        return `<div>
            <label class="block text-[11px] font-semibold mb-1.5 uppercase tracking-wider" style="color:var(--muted)" for="${id}">${label}</label>
            <textarea id="${id}" class="vault-input" rows="3"></textarea>
        </div>`;
    }

    /* =========================================================
       ACTIONS
       ========================================================= */
    function setLang(lang) {
        S.lang = lang;
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        persist();
        renderHeader();
        renderSearch();
        renderFilters();
        renderCards();
        renderFab();
        if (S.modalOpen) renderModal();
        /* Re-focus search if it was focused */
        const si = document.getElementById('search-input');
        if (si && document.activeElement === si) { /* keeps focus */ }
    }

    function onSearch(val) { S.search = val; renderCards(); }
    function onFilter(f) {
        S.filter = f;
        document.querySelectorAll('.filter-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.filter === f));
        renderCards();
    }

    function openModal(type, id=null) {
        S.editId = id;
        S.modalType = type;
        S.modalOpen = true;
        S.fabOpen = false;
        renderFab();
        renderModal();
        document.getElementById('modal-overlay').classList.add('open');
        setTimeout(() => { const first = document.querySelector('#vault-form input, #vault-form textarea'); if(first) first.focus(); }, 100);
    }

    function closeModal() {
        S.modalOpen = false;
        S.editId = null;
        document.getElementById('modal-overlay').classList.remove('open');
    }

    function handleSave(e) {
        e.preventDefault();
        const data = { type: S.modalType };
        const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
        data.title = g('field-title');
        if (S.modalType === 'account') {
            data.username = g('field-username');
            data.password = g('field-password');
            data.url = g('field-url');
            data.notes = g('field-notes');
        } else {
            data.phrase = g('field-phrase');
            data.notes = g('field-notes');
        }
        /* Only save if at least one field has content */
        if (!Object.values(data).some(v => typeof v === 'string' && v.length > 0)) { closeModal(); return; }

        if (S.editId) {
            const idx = S.items.findIndex(i => i.id === S.editId);
            if (idx !== -1) S.items[idx] = { ...S.items[idx], ...data, updatedAt: Date.now() };
        } else {
            S.items.unshift({ id: Date.now(), ...data, createdAt: Date.now(), updatedAt: Date.now() });
        }
        persist();
        toast(t('saved'));
        closeModal();
        renderCards();
        renderFilters();
    }

    function doDelete(id) {
        S.items = S.items.filter(i => i.id !== id);
        S.delConfirmId = null;
        persist();
        toast(t('deleted'));
        renderCards();
        renderFilters();
    }

    function copyToClipboard(text, btn) {
        navigator.clipboard.writeText(text).then(() => {
            if (btn) {
                btn.classList.add('copied');
                const orig = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i>';
                setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = orig; }, 1400);
            }
            toast(t('copied'));
        }).catch(() => {
            /* Fallback */
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.select(); document.execCommand('copy');
            document.body.removeChild(ta);
            toast(t('copied'));
        });
    }

    /* =========================================================
       EVENT DELEGATION
       ========================================================= */
    document.addEventListener('click', (e) => {
        /* Copy */
        const copyBtn = e.target.closest('[data-copy-id]');
        if (copyBtn) {
            const id = parseInt(copyBtn.dataset.copyId);
            const field = copyBtn.dataset.copyField;
            const item = S.items.find(i => i.id === id);
            if (item && item[field]) copyToClipboard(item[field], copyBtn);
            return;
        }

        /* Toggle password visibility */
        const pwBtn = e.target.closest('[data-toggle-pw]');
        if (pwBtn) {
            const id = parseInt(pwBtn.dataset.togglePw);
            S.visPw.has(id) ? S.visPw.delete(id) : S.visPw.add(id);
            renderCards();
            return;
        }

        /* Edit */
        const editBtn = e.target.closest('[data-edit]');
        if (editBtn) {
            const id = parseInt(editBtn.dataset.edit);
            const item = S.items.find(i => i.id === id);
            if (item) openModal(item.type, id);
            return;
        }

        /* Ask delete */
        const askDel = e.target.closest('[data-ask-delete]');
        if (askDel) {
            S.delConfirmId = parseInt(askDel.dataset.askDelete);
            renderCards();
            return;
        }

        /* Confirm delete */
        const doDel = e.target.closest('[data-do-delete]');
        if (doDel) {
            doDelete(parseInt(doDel.dataset.doDelete));
            return;
        }

        /* Cancel delete */
        const cancelDel = e.target.closest('[data-cancel-delete]');
        if (cancelDel) {
            S.delConfirmId = null;
            renderCards();
            return;
        }

        /* FAB toggle */
        if (e.target.closest('[data-fab-toggle]')) {
            S.fabOpen = !S.fabOpen;
            renderFab();
            return;
        }

        /* FAB add */
        const fabAdd = e.target.closest('[data-fab-add]');
        if (fabAdd) {
            openModal(fabAdd.dataset.fabAdd);
            return;
        }

        /* Modal close */
        if (e.target.closest('[data-modal-close]')) {
            closeModal();
            return;
        }

        /* Close FAB when clicking outside */
        if (S.fabOpen && !e.target.closest('.fab-wrap')) {
            S.fabOpen = false;
            renderFab();
        }
    });

    /* Generate password */
    document.addEventListener('click', (e) => {
        const genBtn = e.target.closest('[data-gen-pw]');
        if (genBtn) {
            const pwField = document.getElementById('field-password');
            if (pwField) {
                pwField.value = genPw();
                pwField.type = 'text';
                setTimeout(() => { pwField.type = 'password'; }, 2000);
            }
        }
    });

    /* Close modal on overlay click */
    document.getElementById('modal-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeModal();
    });

    /* Keyboard: Escape to close modal/FAB */
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            if (S.modalOpen) closeModal();
            else if (S.fabOpen) { S.fabOpen = false; renderFab(); }
        }
    });

    /* =========================================================
       INIT
       ========================================================= */
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    renderHeader();
    renderSearch();
    renderFilters();
    renderCards();
    renderFab();
    </script>
</body>
</html>
